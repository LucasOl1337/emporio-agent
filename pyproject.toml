[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer service agent prototype for Empório da Música"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pypdf>=4.0",
]

[project.scripts]
emporio = "emporio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
